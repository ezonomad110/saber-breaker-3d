<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#040110; font-family:'Hiragino Sans',sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { display:block; }
  #hud { position:fixed; top:0; left:0; right:0; padding:calc(8px + env(safe-area-inset-top)) 12px 0; display:flex; justify-content:space-between; z-index:5; pointer-events:none; }
  .hudBox { background:rgba(10,4,32,.62); border:1.5px solid rgba(103,232,249,.55); border-radius:10px; padding:4px 10px; color:#e0f7ff; font-weight:800; font-size:14px; min-width:74px; text-align:center; }
  .hudBox small { display:block; font-size:8.5px; letter-spacing:.16em; color:#67e8f9; }
  #shieldWrap { position:fixed; top:calc(58px + env(safe-area-inset-top)); left:12px; z-index:5; width:150px; pointer-events:none; }
  #shieldWrap small { color:#67e8f9; font-size:9px; font-weight:800; letter-spacing:.16em; text-shadow:0 1px 3px #000; }
  #shieldBarBg { height:12px; border:1.5px solid rgba(103,232,249,.7); border-radius:7px; background:rgba(8,20,40,.6); overflow:hidden; }
  #shieldBar { height:100%; width:100%; background:linear-gradient(90deg,#22d3ee,#4ade80); transition:width .18s; }
  #bossWrap { position:fixed; top:calc(148px + env(safe-area-inset-top)); right:12px; z-index:5; width:150px; pointer-events:none; display:none; text-align:right; }
  #bossWrap small { color:#fda4af; font-size:9px; font-weight:800; letter-spacing:.16em; text-shadow:0 1px 3px #000; }
  #bossBarBg { height:12px; border:1.5px solid rgba(244,114,182,.7); border-radius:7px; background:rgba(40,8,20,.6); overflow:hidden; }
  #bossBar { height:100%; width:100%; background:linear-gradient(90deg,#f43f5e,#f59e0b); transition:width .18s; }
  #popLayer { position:fixed; inset:0; pointer-events:none; z-index:6; overflow:hidden; }
  .pop { position:absolute; left:50%; transform:translateX(-50%); font-weight:900; white-space:nowrap; text-shadow:0 0 12px currentColor, 0 2px 2px rgba(0,0,0,.6); animation:popRise 1.1s ease-out forwards; }
  @keyframes popRise { 0%{opacity:0; scale:.7;} 15%{opacity:1; scale:1.1;} 30%{scale:1;} 75%{opacity:1;} 100%{opacity:0; margin-top:-24px;} }
  body { touch-action: none; overscroll-behavior: none; }
  canvas { touch-action: none; }
  #dmgFlash { position:fixed; inset:0; z-index:4; pointer-events:none; background:radial-gradient(ellipse at center, transparent 55%, rgba(239,68,68,.55) 100%); opacity:0; }
  #stickBase { position:fixed; left:18px; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:7; width:118px; height:118px; border-radius:50%; border:2px solid rgba(103,232,249,.55); background:radial-gradient(circle, rgba(14,60,90,.35), rgba(8,30,50,.55)); }
  #stickKnob { position:absolute; left:50%; top:50%; width:52px; height:52px; border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(125,211,252,.95), rgba(2,90,160,.95)); border:2px solid rgba(255,255,255,.6); transform:translate(-50%,-50%); box-shadow:0 0 14px rgba(56,189,248,.6); }
  #fireBtn { position:fixed; right:16px; bottom:calc(22px + env(safe-area-inset-bottom)); z-index:7; width:96px; height:96px; border-radius:50%; border:3px solid rgba(252,165,165,.85); background:radial-gradient(circle at 35% 30%, rgba(220,38,38,.85), rgba(127,29,29,.92)); color:#fee2e2; font-size:15px; font-weight:900; box-shadow:0 0 22px rgba(239,68,68,.5); }
  #fireBtn.on { transform:scale(.93); }
  .overlay { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:rgba(3,0,12,.55); text-align:center; padding:20px; }
  .overlay h1 { color:#f0abfc; font-size:37px; font-weight:900; letter-spacing:.04em; text-shadow:0 0 18px rgba(217,70,239,.8), 0 0 46px rgba(59,130,246,.6); }
  .overlay h1 span { display:block; font-size:15px; color:#67e8f9; letter-spacing:.38em; margin-top:4px; }
  .overlay p { color:#cffafe; font-size:14px; font-weight:700; line-height:1.8; }
  .miniBtn { margin-top:14px; background:rgba(8,47,73,.55); border:1.5px solid rgba(125,211,252,.55); color:#bae6fd; font-size:12.5px; font-weight:700; letter-spacing:.06em; padding:8px 20px; border-radius:999px; }
  .bigBtn { background:#082f49; border:2px solid #38bdf8; color:#fff; font-size:18px; font-weight:800; letter-spacing:.1em; padding:13px 36px; border-radius:999px; box-shadow:0 0 18px rgba(56,189,248,.6); }
  #resultPanel { display:none; }
  #pauseBtn { position:fixed; right:60px; top:calc(96px + env(safe-area-inset-top)); z-index:7; width:40px; height:40px; border-radius:50%; border:2px solid rgba(255,255,255,.45); background:rgba(10,4,32,.65); color:#fff; font-size:15px; }
  #pauseLabel { position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); z-index:8; display:none; color:#fff; font-size:34px; font-weight:900; letter-spacing:.3em; text-shadow:0 2px 14px #000, 0 0 34px rgba(56,189,248,.8); pointer-events:none; }
  #tuneBtn { position:fixed; right:12px; top:calc(96px + env(safe-area-inset-top)); z-index:7; width:40px; height:40px; border-radius:50%; border:2px solid rgba(255,255,255,.45); background:rgba(10,4,32,.65); color:#fff; font-size:18px; }
  #tunePanel { position:fixed; right:12px; top:calc(142px + env(safe-area-inset-top)); z-index:7; width:225px; background:rgba(8,4,30,.94); border:1.5px solid rgba(103,232,249,.55); border-radius:14px; padding:12px 14px; color:#e0f7ff; display:none; }
  #tunePanel label { display:block; font-size:12px; font-weight:700; margin:8px 0 2px; }
  #tunePanel input { width:100%; }
  #tunePanel .val { color:#f0abfc; }
</style>

<body>
<div id="hud">
  <div class="hudBox"><small>SCORE</small><span id="scoreVal">0</span></div>
  <div class="hudBox"><small>DISTANCE</small><span id="distVal">4200m</span></div>
  <div class="hudBox"><small>HITS</small><span id="hitsVal">0</span></div>
</div>
<div id="shieldWrap"><small>SHIELD</small><div id="shieldBarBg"><div id="shieldBar"></div></div></div>
<div id="bossWrap"><small id="bossLabel">STAR DESTROYER</small><div id="bossBarBg"><div id="bossBar"></div></div></div>

<button id="fireBtn">🔥<br>FIRE</button>

  <label>飛行速度 <span class="val" id="vSpd"></span></label>
  <input type="range" id="sSpd" min="0.7" max="1.4" step="0.05">
  <label>連射速度 <span class="val" id="vRate"></span></label>
  <input type="range" id="sRate" min="0.7" max="1.6" step="0.1">
  <label>スティック感度 <span class="val" id="vSens"></span></label>
  <input type="range" id="sSens" min="0.7" max="1.6" step="0.1">
</div>

<div class="overlay" id="titlePanel">
  <h1>SABER BREAKER<span>— RAIL RUN —</span></h1>
  <p>自動で前進するレールシューター。<br>左スティックで操縦、右ボタン長押しでレーザー連射。<br>リングをくぐるとシールド回復。ボスは<b>弱点</b>しか効かない。<br>全2ステージ、間はハイパードライブで繋ぐ。<br>STAGE 2はデス・スターのトレンチを抜けて、小さな<b>排気口</b>を撃て。</p>
  <button class="bigBtn" id="startBtn">▶ LAUNCH</button><br>
  <button class="miniBtn" id="stage2Btn">検証用：STAGE 2 から開始</button>
  <button class="miniBtn" id="stage3Btn">検証用：STAGE 3 から開始</button>
  <p style="margin-top:16px; font-size:11.5px; line-height:1.7; color:rgba(186,230,253,.75);">📱 全画面で遊ぶには： Safariの「共有」→「ホーム画面に追加」して、追加したアイコンから起動（横向き推奨）</p>
</div>

<script type="module">
import * as THREE from 'three';

/* ============================== tuning ============================== */
const TUNE_KEY = 'saberRailTuneV1';
const tune = Object.assign({ spd: 1.0, rate: 1.0, sens: 1.0 }, JSON.parse(localStorage.getItem(TUNE_KEY) || '{}'));
function saveTune(){ localStorage.setItem(TUNE_KEY, JSON.stringify(tune)); }

/* ============================== sound ============================== */
let AC = null;
function ac(){ try{ if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }catch(e){ return null; } }
function beep(f, d = 0.07, type = 'square', v = 0.04, slide = 0){
  const c = ac(); if (!c) return;
  try{
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d);
  }catch(e){}
}
const sndLaser = () => beep(920, 0.09, 'square', 0.028, -620);
const sndBoom = big => { beep(130, 0.3, 'sawtooth', 0.07, -80); if (big) beep(62, 0.55, 'square', 0.07, -28); };
const sndHurt = () => beep(190, 0.22, 'sawtooth', 0.07, -80);
const sndRing = () => { beep(880, 0.09, 'sine', 0.05); setTimeout(() => beep(1320, 0.12, 'sine', 0.05), 70); };
const sndGuard = () => beep(240, 0.05, 'square', 0.02, -60);
const sndHyper = () => { beep(180, 1.9, 'sawtooth', 0.05, 1050); beep(90, 1.9, 'square', 0.04, 500); };

/* ============================== scene ============================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040110);
scene.fog = new THREE.Fog(0x040110, 70, 210);
const camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, 0.1, 500);
scene.add(new THREE.HemisphereLight(0x8899ff, 0x0a0618, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(6, 14, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0x38bdf8, 0.9); rim.position.set(-8, 6, -14); scene.add(rim);

const starGeo = new THREE.BufferGeometry();
{
  const n = 800, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++){ pos[i*3] = (Math.random()-0.5) * 260; pos[i*3+1] = (Math.random()-0.5) * 160; pos[i*3+2] = -Math.random() * 300; }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
}
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xbfe9ff, size: 0.7 }));
scene.add(stars);
const planet = new THREE.Mesh(new THREE.SphereGeometry(26, 24, 18), new THREE.MeshStandardMaterial({ color: 0x7c5cbf, roughness: 0.9, emissive: 0x1c1038 }));
planet.position.set(-58, 26, -190);
scene.add(planet);

/* canyon (stage 3): planet surface — scrolling ground + rock walls + mesas + sun */
const canyon = new THREE.Group();
const canyonSegs = [];
const canyonLight = new THREE.AmbientLight(0xffd9b0, 0);
scene.add(canyonLight);
let groundMesh, groundTex, sunMesh;
{
  const cnv = document.createElement('canvas'); cnv.width = cnv.height = 256;
  const g2 = cnv.getContext('2d');
  g2.fillStyle = '#8a5a33'; g2.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 26; i++){ g2.fillStyle = i % 2 ? 'rgba(94,58,31,.35)' : 'rgba(181,126,70,.28)'; g2.beginPath(); g2.ellipse(Math.random() * 256, Math.random() * 256, 18 + Math.random() * 42, 12 + Math.random() * 30, Math.random() * 3, 0, 6.29); g2.fill(); }
  const dots = ['#5e3a1f', '#9c6b3f', '#6e4526', '#b57e46', '#7d5230'];
  for (let i = 0; i < 2000; i++){ g2.fillStyle = dots[i % dots.length]; g2.fillRect(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 4, 2 + Math.random() * 4); }
  g2.strokeStyle = 'rgba(90,58,32,.55)'; g2.lineWidth = 1.4;
  for (let i = 0; i < 7; i++){ g2.beginPath(); let x = Math.random() * 256, y = Math.random() * 256; g2.moveTo(x, y); for (let k = 0; k < 4; k++){ x += (Math.random() - 0.5) * 60; y += (Math.random() - 0.5) * 60; g2.lineTo(x, y); } g2.stroke(); }
  groundTex = new THREE.CanvasTexture(cnv);
  groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
  groundTex.repeat.set(36, 60);
  groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(240, 400), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1 }));
  groundMesh.rotation.x = -Math.PI / 2;
  groundMesh.position.y = 0;
  groundMesh.visible = false;
  scene.add(groundMesh);

  const rockMats = [0x8a5a33, 0x7d5230, 0x96683c].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.95 }));
  const rockGeo = new THREE.DodecahedronGeometry(1);
  const rockMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), SC = new THREE.Vector3(), CC = new THREE.Color(), E = new THREE.Euler();
  for (let i = 0; i < 18; i++){
    const seg = new THREE.Group();
    const rocks = new THREE.InstancedMesh(rockGeo, rockMat, 52);
    rocks.frustumCulled = false;
    let ri = 0;
    for (const side of [-1, 1]){
      const wall = new THREE.Mesh(new THREE.BoxGeometry(7, 18, 30), rockMats[i % 3]);
      wall.position.set(side * 14.5, 4, -15);
      seg.add(wall);
      const rim = new THREE.Mesh(new THREE.BoxGeometry(7.4, 0.9, 30), rockMats[2]);
      rim.position.set(side * 14.5, 13.4, -15);
      seg.add(rim);
      const mesa = new THREE.Mesh(new THREE.BoxGeometry(12 + Math.random() * 8, 30, 10 + Math.random() * 8), rockMats[(i + 1) % 3]);
      mesa.position.set(side * (30 + Math.random() * 8), 13, -6 - Math.random() * 16);
      seg.add(mesa);
      for (let k = 0; k < 26; k++){
        V.set(side * (12.15 + Math.random() * 0.8), 0.4 + Math.random() * 12.5, -Math.random() * 30);
        const sc = 0.7 + Math.random() * 1.4;
        SC.set(sc, sc * (0.6 + Math.random() * 0.8), sc);
        E.set(Math.random() * 3, Math.random() * 3, Math.random() * 3); Q.setFromEuler(E);
        M.compose(V, Q, SC);
        rocks.setMatrixAt(ri, M);
        rocks.setColorAt(ri, CC.set([0x8a5a33, 0x74482a, 0x9c6b3f, 0x654321][ri % 4]));
        ri++;
      }
    }
    seg.add(rocks);
    seg.position.z = -i * 30;
    canyon.add(seg);
    canyonSegs.push(seg);
  }
  sunMesh = new THREE.Group();
  const sunCore = new THREE.Mesh(new THREE.CircleGeometry(20, 24), new THREE.MeshBasicMaterial({ color: 0xffc07a, transparent: true, opacity: 0.95, fog: false }));
  const sunHalo = new THREE.Mesh(new THREE.CircleGeometry(38, 24), new THREE.MeshBasicMaterial({ color: 0xff9a3c, transparent: true, opacity: 0.22, fog: false }));
  sunHalo.position.z = -1;
  sunMesh.add(sunHalo, sunCore);
  sunMesh.visible = false;
  scene.add(sunMesh);
}
canyon.visible = false;
scene.add(canyon);

/* desert props (stage 3 open section, dist ~1280-2020): distant mesas and dunes */
const desertProps = new THREE.Group();
{
  const dm = [0x8a5a33, 0x7d5230, 0x96683c].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 1 }));
  for (let k = 0; k < 10; k++){
    const side = k % 2 === 0 ? -1 : 1;
    const w = 16 + Math.random() * 14, h = 20 + Math.random() * 16, d = 14 + Math.random() * 10;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), dm[k % 3]);
    m.position.set(side * (38 + Math.random() * 45), h / 2 - 2, -(1300 + k * 72 + Math.random() * 30));
    desertProps.add(m);
  }
  for (let k = 0; k < 5; k++){
    const dune = new THREE.Mesh(new THREE.BoxGeometry(34, 3, 18), dm[(k + 1) % 3]);
    dune.position.set((k % 2 === 0 ? -1 : 1) * (24 + Math.random() * 26), 0.8, -(1340 + k * 150 + Math.random() * 40));
    desertProps.add(dune);
  }
}
desertProps.visible = false;
scene.add(desertProps);

/* hyperdrive streaks */
const streaks = new THREE.Group();
{
  const mat = new THREE.MeshBasicMaterial({ color: 0xa5f3fc, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
  for (let i = 0; i < 130; i++){
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 7), mat);
    const a = Math.random() * Math.PI * 2, r = 4 + Math.random() * 26;
    m.position.set(Math.cos(a) * r, 6.5 + Math.sin(a) * r * 0.7, -Math.random() * 160);
    streaks.add(m);
  }
}
streaks.visible = false;
scene.add(streaks);

/* Death Star: giant sphere looming at the end of the stage 2 approach */
const dsGroup = new THREE.Group();
{
  const sphere = new THREE.Mesh(new THREE.SphereGeometry(120, 28, 20), new THREE.MeshStandardMaterial({ color: 0x8b95a5, metalness: 0.35, roughness: 0.65 }));
  const dish = new THREE.Mesh(new THREE.CircleGeometry(26, 24), new THREE.MeshStandardMaterial({ color: 0x6e7787, metalness: 0.4, roughness: 0.6, side: THREE.DoubleSide }));
  dish.position.set(-30, 32, 108);
  dish.lookAt(-30, 32, 300);
  const dishInner = new THREE.Mesh(new THREE.CircleGeometry(9, 18), new THREE.MeshBasicMaterial({ color: 0x39424f, side: THREE.DoubleSide }));
  dishInner.position.set(-30, 32, 108.5);
  dishInner.lookAt(-30, 32, 300);
  dsGroup.add(sphere, dish, dishInner);
}
dsGroup.visible = false;
scene.add(dsGroup);

/* trench (stage 2): Death Star trench — dense greeble walls, pipes, glow lights, bridges */
const trench = new THREE.Group();
const trenchSegs = [];
const trenchLight = new THREE.AmbientLight(0xaebdd0, 0);
scene.add(trenchLight);
{
  const wallMats = [0x939cab, 0x868fa0, 0x9aa3b4].map(c => new THREE.MeshStandardMaterial({ color: c, metalness: 0.35, roughness: 0.62 }));
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x59616f, metalness: 0.35, roughness: 0.7 });
  const greebles = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.35, roughness: 0.6 }), 1250);
  const pipeGeo = new THREE.CylinderGeometry(1, 1, 1, 8); pipeGeo.rotateX(Math.PI / 2);
  const pipes = new THREE.InstancedMesh(pipeGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.5, roughness: 0.5 }), 60);
  const glows = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff }), 420);
  greebles.frustumCulled = pipes.frustumCulled = glows.frustumCulled = false;
  let gi = 0, pi = 0, li = 0;
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), SC = new THREE.Vector3(), CC = new THREE.Color();
  const put = (mesh, i, x, y, z, sx, sy, sz, color) => { V.set(x, y, z); SC.set(sx, sy, sz); M.compose(V, Q, SC); mesh.setMatrixAt(i, M); mesh.setColorAt(i, CC.set(color)); };
  const grayHex = (lo = 0.5, hi = 0.82) => { const v = lo + Math.random() * (hi - lo); return new THREE.Color(v, v * 1.03, v * 1.12).getHex(); };
  for (let i = 0; i < 9; i++){
    const seg = new THREE.Group();
    const baseZ = -i * 30;
    const wm = wallMats[i % wallMats.length];
    for (const side of [-1, 1]){
      const wall = new THREE.Mesh(new THREE.BoxGeometry(2.2, 15, 30), wm);
      wall.position.set(side * 9.2, 6, baseZ - 15);
      seg.add(wall);
      /* dense machinery greebles on the wall face */
      for (let k = 0; k < 46; k++){
        const d = 0.25 + Math.random() * 0.65, h = 0.5 + Math.random() * 2.6, w = 0.8 + Math.random() * 3.6;
        const col = Math.random() < 0.08 ? 0x8a5a40 : grayHex();
        put(greebles, gi++, side * (8.1 - d / 2), 0.3 + Math.random() * 12.6, baseZ - Math.random() * 30, d, h, w, col);
      }
      /* silhouette towers along the wall top */
      for (let k = 0; k < 3; k++){
        const h = 1.5 + Math.random() * 3.6;
        put(greebles, gi++, side * (9.2 + (Math.random() - 0.5) * 0.8), 13.3 + h / 2, baseZ - Math.random() * 30, 1.2 + Math.random() * 1.4, h, 1.5 + Math.random() * 2.5, grayHex(0.4, 0.62));
      }
      if (Math.random() < 0.7) put(greebles, gi++, side * 9.2, 16.5 + Math.random() * 2, baseZ - Math.random() * 30, 0.14, 3 + Math.random() * 2.5, 0.14, 0x6b7280);

function stickSet(e){
  const r = stickBase.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const len = Math.hypot(dx, dy), max = 40;
  if (len > max){ dx *= max / len; dy *= max / len; }

  stickVec.x = dx / max; stickVec.y = dy / max;
}

const stickEnd = e => { if (e.pointerId === stickId){ stickId = null; stickVec.x = 0; stickVec.y = 0; stickKnob.style.transform = 'translate(-50%,-50%)'; stickBase.style.left = ''; stickBase.style.top = ''; stickBase.style.bottom = ''; } };

/* ============================== combat helpers ============================== */
const beamCache = new Map();
function beamAssets(colorHex, len, r){
  const key2 = colorHex + '|' + len + '|' + r;
  if (!beamCache.has(key2)){
    const glowGeo = new THREE.CylinderGeometry(r, r, len, 8, 1, true); glowGeo.rotateX(Math.PI / 2);
    const coreGeo = new THREE.CylinderGeometry(r * 0.45, r * 0.45, len * 1.02, 6); coreGeo.rotateX(Math.PI / 2);
    const capGeo = new THREE.SphereGeometry(r * 0.45, 6, 5);
    const glowMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    beamCache.set(key2, { glowGeo, coreGeo, capGeo, glowMat, coreMat });
  }
  return beamCache.get(key2);
}
function buildBeam(colorHex, len, r){
  const A = beamAssets(colorHex, len, r);
  const g = new THREE.Group();
  const glow = new THREE.Mesh(A.glowGeo, A.glowMat);
  const core = new THREE.Mesh(A.coreGeo, A.coreMat);
  const capA = new THREE.Mesh(A.capGeo, A.coreMat); capA.position.z = len * 0.51;
  const capB = new THREE.Mesh(A.capGeo, A.coreMat); capB.position.z = -len * 0.51;
  g.add(glow, core, capA, capB);
  g.userData.shared = true;
  return g;
}
function zapMesh(m){
  scene.remove(m);
  if (m.userData && m.userData.shared) return;
  m.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
}

function fireLaser(){
  const tip = cannonTips[S.cannonIdx % 4]; S.cannonIdx++;
  const m = buildBeam(0x4ade80, 2.9, 0.11);
  const sx = S.px + tip.x, sy = S.py + tip.y, sz = S.pz + tip.z;
  m.position.set(sx, sy, sz);
  const dx = S.px - sx, dy = S.py - sy, dz = -55 - tip.z;
  const dl = Math.hypot(dx, dy, dz) || 1, sp = 125;
  scene.add(m);
  shots.push({ x: sx, y: sy, z: sz, vx: dx / dl * sp, vy: dy / dl * sp, vz: dz / dl * sp, mesh: m });

}
function fireEbolt(fx, fy, fz, speed = 34, jx = 0, jy = 0){

/* ============================== main loop ============================== */
const clock = new THREE.Clock();
const _camV = new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  if (S.paused){ renderer.render(scene, camera); return; }
  const dt = Math.min(clock.getDelta(), 0.05);
  S.time += dt;
  const t = S.time;
  const cfg = STAGES[S.stage];

  if (S.mode === 'hyper'){
    S.hyperT -= dt;
    S.px += (0 - S.px) * (1 - Math.exp(-3 * dt));
    S.py += (6.5 - S.py) * (1 - Math.exp(-3 * dt));
    ship.position.set(S.px, S.py, S.pz);
    ship.rotation.z *= 0.9; ship.rotation.x *= 0.9;
    const prog = 1 - Math.max(0, S.hyperT) / 2.8;
    camera.fov = 66 + Math.sin(prog * Math.PI) * 30;
    camera.updateProjectionMatrix();
    streaks.position.set(S.px * 0.6, 0, S.pz);
    for (const m of streaks.children){
      m.position.z += 175 * dt;
      if (m.position.z > 12) m.position.z -= 200;
    }
    _camV.set(S.px * 0.62, S.py * 0.62 + 2.7, S.pz + 9.5); camera.position.lerp(_camV, 1 - Math.exp(-8.5 * dt));
    camera.lookAt(S.px * 0.85, S.py * 0.85 + 0.3, S.pz - 30);
    reticle.visible = reticle2.visible = false;
    if (S.hyperT <= 0){ if (S.hyperDest === 'clear'){ streaks.visible = false; camera.fov = 66; camera.updateProjectionMatrix(); endGame(true); } else if (S.hyperDest === 'stage3') setupStage3(); else setupStage2(); }
  }
  else if (S.mode === 'playing'){
    const inFight = !!S.boss || !!S.coreFight || !!S.walkerFight || S.dist >= cfg.len;
    const speed = inFight ? 0 : 34 * tune.spd;
    if (!inFight){ S.dist += speed * dt; S.pz = -S.dist; }
    const kv = keyVec();
    const bxLim = (S.stage === 3 && S.dist > 1280 && S.dist < 2020) ? 16 : cfg.bx;
    S.tx = THREE.MathUtils.clamp(S.tx + (stickVec.x + kv.x) * 24 * tune.sens * dt, -bxLim, bxLim);
    S.ty = THREE.MathUtils.clamp(S.ty + (-stickVec.y + kv.y) * 20 * tune.sens * dt, cfg.yMin, cfg.yMax);
    const prevPx = S.px, prevPy = S.py;
    S.px += (S.tx - S.px) * (1 - Math.exp(-8 * dt));
    S.py += (S.ty - S.py) * (1 - Math.exp(-8 * dt));
    const vx = dt > 0 ? (S.px - prevPx) / dt : 0, vy = dt > 0 ? (S.py - prevPy) / dt : 0;
    ship.position.set(S.px, S.py, S.pz);
    ship.rotation.z = THREE.MathUtils.clamp(-vx * 0.045, -0.6, 0.6);
    ship.rotation.x = THREE.MathUtils.clamp(vy * 0.03, -0.35, 0.35);
    if (S.hurtT > 0){ S.hurtT -= dt; ship.visible = Math.floor(t * 16) % 2 === 0; }
    else ship.visible = true;
    if (S.guardPopT > 0) S.guardPopT -= dt;
    if (S.dmgFlash > 0){ S.dmgFlash = Math.max(0, S.dmgFlash - dt * 2.4); $('dmgFlash').style.opacity = S.dmgFlash * 0.9; }

    if (S.stage === 3 && !S.desertPop && S.dist >= 1280){ S.desertPop = true; pop('OPEN DESERT!', '#fdba74', 28); }
    const EVENTS = S.stage === 1 ? EVENTS1 : S.stage === 2 ? EVENTS2 : EVENTS3;
    while (S.eventIdx < EVENTS.length && S.dist >= EVENTS[S.eventIdx].at){ spawnEvent(EVENTS[S.eventIdx]); S.eventIdx++; }
    if ((S.stage === 2 && !S.coreFight) || (S.stage === 3 && !S.walkerFight)){
      S.trickleT -= dt;
      if (S.trickleT <= 0){ spawnFoe('head', (Math.random() * 2 - 1) * 5, 3.5 + Math.random() * 6, S.pz - 175); S.trickleT = 6.5; }
    }
    if (S.stage === 1 && S.dist >= cfg.len && !S.boss) spawnBoss();
    if (S.stage === 2 && S.dist >= cfg.len && !S.coreFight) spawnCoreFight();
    if (S.stage === 3 && S.dist >= cfg.len && !S.walkerFight) spawnWalkerFight();

    /* rocks: stage 1 space + drift during end fights */
    S.rockT -= dt;
    let rockInterval = -1, rockVz = 0;
    if (inFight){ rockInterval = (S.boss || S.coreFight || S.walkerFight) ? -1 : 0.9; rockVz = 20; }
    else if (S.stage === 1) rockInterval = (S.dist > 1500 && S.dist < 3350) ? 0.42 : 1.5;
    if (rockInterval > 0 && S.rockT <= 0){
      S.rockT = rockInterval;
      const r = 1.8 + Math.random() * 2.6;
      const mesh = buildRock(r);
      const rx = (Math.random() * 2 - 1) * 13, ry = 1 + Math.random() * 13, rz = S.pz - 175;
      mesh.position.set(rx, ry, rz);
      scene.add(mesh);
      rocks.push({ x: rx, y: ry, z: rz, r, vz: rockVz, mesh, spin: (Math.random() - 0.5) * 0.8, dead: false });
    }

    /* firing */
    if (firing){
      S.fireT -= dt;
      if (S.fireT <= 0){ fireLaser(); S.fireT = 0.15 / tune.rate; }
    } else S.fireT = 0;

    /* player shots */
    const bz = S.pz - 62;
    for (const sh of shots){
      sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.z += sh.vz * dt;
      sh.mesh.position.set(sh.x, sh.y, sh.z);
      sh.mesh.lookAt(sh.x + sh.vx, sh.y + sh.vy, sh.z + sh.vz);
      sh.mesh.scale.z = 0.93 + Math.random() * 0.14;
      for (const f of foes){
        if (f.dead) continue;
        if (Math.abs(sh.z - f.z) < 1.7 && Math.hypot(sh.x - f.x, sh.y - f.y) < 1.7){
          sh.z = 9999; f.hp--;
          boom(f.x, f.y, f.z, 0xfacc15, 0.5);
          if (f.hp <= 0) killFoe(f);
          break;
        }
      }
      if (sh.z > 9000) continue;
      for (const u of turrets){
        if (u.dead) continue;
        if (Math.abs(sh.z - u.z) < 1.6 && Math.hypot(sh.x - u.x, sh.y - u.y) < 1.9){
          sh.z = 9999; u.hp--;
          boom(u.x, u.y, u.z, 0xfacc15, 0.5);
          if (u.hp <= 0){ u.dead = true; scene.remove(u.mesh); S.score += 150; S.hits++; pop('TURRET +150', '#facc15', 20); sndBoom(false); refreshHud(); }
          break;
        }
      }
      if (sh.z > 9000) continue;
      for (const r of rocks){
        if (Math.abs(sh.z - r.z) < r.r && Math.hypot(sh.x - r.x, sh.y - r.y) < r.r){ sh.z = 9999; boom(sh.x, sh.y, sh.z + 1, 0xd6c8a8, 0.4); break; }
      }
      if (sh.z > 9000) continue;
      /* boss weak points only */
      if (S.boss){
        const B = S.boss;
        let consumed = false;
        for (const d of B.domes){
          if (!d.alive) continue;
          const dwx = S.bossSwayX - d.mesh.position.x, dwy = 6.8, dwz = bz - 16;
          if (Math.abs(sh.z - dwz) < 2.4 && Math.hypot(sh.x - dwx, sh.y - dwy) < 2.4){
            sh.z = 9999; consumed = true; d.hp--; S.bossHp--;
            boom(dwx, dwy, dwz, 0xfacc15, 0.75);
            if (d.hp <= 0){
              d.alive = false; d.mesh.visible = false; if (d.halo) d.halo.visible = false; if (d.marker) d.marker.visible = false; S.score += 300; pop('TURRET DOWN +300', '#facc15', 22); sndBoom(false);
              if (B.domes.every(x => !x.alive) && !B.coreOpen){
                B.coreOpen = true; B.core.visible = true; B.coreGlow.visible = true; if (B.coreMarker) B.coreMarker.visible = true;
                S.bossHp = B.coreHp; S.bossMaxHp = B.coreHp;
                pop('コア出現！ そこを撃て！', '#4ade80', 26);
                beep(660, 0.2, 'square', 0.05, 440);
              }
            }
            refreshHud(); break;
          }
        }
        if (!consumed && B.coreOpen){
          const cwx = S.bossSwayX, cwy = 4.8, cwz = bz + 6;
          if (Math.abs(sh.z - cwz) < 2.6 && Math.hypot(sh.x - cwx, sh.y - cwy) < 2.5){
            sh.z = 9999; consumed = true; B.coreHp--; S.bossHp--;
            boom(cwx, cwy, cwz, 0x4ade80, 0.8);
            refreshHud();
          }
        }
        if (!consumed && sh.z < bz + 26 && sh.z > bz - 12 && Math.abs(sh.x - S.bossSwayX) < 14 && Math.abs(sh.y - 1.9) < 2.4){
          sh.z = 9999;
          boom(sh.x, sh.y, sh.z + 1, 0x9aa4b5, 0.35);
          sndGuard();
          if (S.guardPopT <= 0){ pop('NO DAMAGE', '#94a3b8', 17); S.guardPopT = 1.4; }
        }
        if (sh.z > 9000) continue;
      }
      /* stage 2 reactor core */
      if (S.coreFight){
        const cz = S.pz - 55;
        if (Math.abs(sh.z - cz) < 1.8 && Math.hypot(sh.x - 0, sh.y - 5.2) < 1.8){
          sh.z = 9999; S.coreFight.hp--;
          boom(sh.x, sh.y, cz + 1, 0xfb923c, 0.8);
          pop('HIT!', '#fb923c', 18);
          refreshHud();
        } else if (Math.abs(sh.z - cz) < 2.2 && Math.hypot(sh.x - 0, sh.y - 5.2) < 9){
          sh.z = 9999;
          boom(sh.x, sh.y, cz + 1, 0x9aa4b5, 0.35);
          sndGuard();
        }
      }
    }
    /* stage 3 walker: head is the weak point, hull is armored */
    for (const sh of shots){
      if (!S.walkerFight) break;
      if (sh.z > 9000) continue;
      const W = S.walkerFight, hz = W.wz + 7;
      if (Math.abs(sh.z - hz) < 2.4 && Math.hypot(sh.x - W.swayX, sh.y - 8.2) < 2.6){
        sh.z = 9999; W.hp--;
        boom(sh.x, sh.y, hz + 1, 0xfb923c, 0.9);
        pop('HIT!', '#fb923c', 18);
        refreshHud();
      } else if (sh.z < W.wz + 8 && sh.z > W.wz - 8 && Math.abs(sh.x - W.swayX) < 5.4 && sh.y > 0 && sh.y < 13){
        sh.z = 9999;
        boom(sh.x, sh.y, sh.z + 1, 0x9aa4b5, 0.35);
        sndGuard();
        if (S.guardPopT <= 0){ pop('NO DAMAGE', '#94a3b8', 17); S.guardPopT = 1.4; }
      }
    }
    shots = shots.filter(sh => { if (sh.z > 9000 || sh.z < S.pz - 210){ zapMesh(sh.mesh); return false; } return true; });

    /* foes */
    for (const f of foes){
      if (f.kind === 'chase' || f.kind === 'vader' || f.kind === 'streak'){
        const distA = S.pz - f.z;
        if (f.kind === 'streak' && f.state === 'approach'){
          f.z -= (54 + speed) * dt;
          f.x += (f.baseX - f.x) * (1 - Math.exp(-2.2 * dt));
          f.y += (f.baseY - f.y) * (1 - Math.exp(-2.2 * dt));
          if (S.pz - f.z >= 27){ f.state = 'duel'; f.baseX = f.x; f.baseY = f.y; f.duelAge = 0; }
        } else if (f.kind === 'streak' && f.state === 'duel'){
          f.duelAge = (f.duelAge || 0) + dt;
          f.z = S.pz - 27 + Math.sin(t * 0.9 + f.phase) * 1.5 * Math.min(1, f.duelAge * 2);
          f.baseX += THREE.MathUtils.clamp(S.px - f.baseX, -1, 1) * 0.6 * dt;
          f.x = THREE.MathUtils.clamp(f.baseX + Math.sin(t * 1.15 + f.phase) * 2.1, -Math.min(10.5, cfg.bx), Math.min(10.5, cfg.bx));
          f.y = f.baseY + Math.sin(t * 1.4 + f.phase) * 1.1;
          f.duelT -= dt;
          f.shootT -= dt;
          if (f.shootT <= 0){ fireEbolt(f.x, f.y, f.z, 36); f.shootT = f.shootBase + Math.random() * 0.7; }
          if (f.duelT <= 0) f.state = 'flee';
        } else if (f.kind === 'streak'){
          f.z -= 95 * dt;
          if (S.pz - f.z > 200) f.dead = true;
        } else if (f.state === 'approach'){
          f.z -= 21 * dt;
          f.x = f.baseX + Math.sin(t * 1.3 + f.phase) * 1.1;
          if (distA <= 30){ f.state = 'duel'; f.zOff = Math.max(20, S.pz - f.z); f.duelAge = 0; }
        } else if (f.state === 'duel'){
          f.duelAge += dt;
          f.zOff += (29 - f.zOff) * (1 - Math.exp(-3 * dt));
          f.z = S.pz - f.zOff + Math.sin(t * 0.9 + f.phase) * 1.5 * Math.min(1, f.duelAge * 2);
          f.baseX += THREE.MathUtils.clamp(S.px - f.baseX, -1, 1) * 0.6 * dt;
          f.x = THREE.MathUtils.clamp(f.baseX + Math.sin(t * 1.15 + f.phase) * 2.1, -Math.min(10.5, cfg.bx), Math.min(10.5, cfg.bx));
          f.y = f.baseY + Math.sin(t * 1.4 + f.phase) * 1.1;
          f.duelT -= dt;
          f.shootT -= dt;
          if (f.shootT <= 0){ fireEbolt(f.x, f.y, f.z, 36); f.shootT = f.shootBase + Math.random() * 0.7; }
          if (f.duelT <= 0) f.state = 'flee';
        } else {
          f.z -= 52 * dt;
          if (S.pz - f.z > 200) f.dead = true;
        }
      } else {
        f.z += 20 * dt;
        f.x = f.baseX + Math.sin(t * 1.7 + f.phase) * 0.9;
        f.shootT -= dt;
        if (f.shootT <= 0 && f.z < S.pz - 25){ fireEbolt(f.x, f.y, f.z, 34); f.shootT = 2.2 + Math.random() * 2.2; }
      }
      f.mesh.position.set(f.x, f.y, f.z);
      f.mesh.rotation.z = Math.sin(t * 2 + f.phase) * 0.15;
      if (!f.dead && Math.abs(f.z - S.pz) < 1.7 && Math.hypot(f.x - S.px, f.y - S.py) < 1.8){
        killFoe(f, false);
        damage(12);
        if (S.mode !== 'playing') return;
      }
      if (f.z > S.pz + 14 && f.kind !== 'streak') f.dead = true;
      if (f.dead) scene.remove(f.mesh);
    }
    foes = foes.filter(f => !f.dead);

    /* turrets */
    for (const u of turrets){
      if (u.dead) continue;
      u.shootT -= dt;
      if (u.shootT <= 0 && u.z < S.pz - 10 && u.z > S.pz - 130){ fireEbolt(u.x, u.y, u.z, 33); u.shootT = 2.3 + Math.random() * 0.9; }
      if (u.z > S.pz + 12){ u.dead = true; scene.remove(u.mesh); }
    }
    turrets = turrets.filter(u => !u.dead);

    /* watchtowers: shoot back, block the corridor */
    for (const tw of towers){
      if (tw.dead) continue;
      if (tw.kind !== 'mesa'){
        tw.shootT -= dt;
        if (tw.shootT <= 0 && tw.z < S.pz - 12 && tw.z > S.pz - 140){ fireEbolt(tw.x + 0.9, 11.9, tw.z + 2.4, 34); tw.shootT = 1.5 + Math.random() * 0.7; }
      }
      const cr = tw.kind === 'mesa' ? 3.7 : 2.9;
      if (!tw.hitDone && Math.abs(S.pz - tw.z) < 2.0 && Math.abs(S.px - tw.x) < cr){
        tw.hitDone = true;
        damage(15);
        S.tx = THREE.MathUtils.clamp(tw.x + (S.px < tw.x ? -(cr + 0.9) : cr + 0.9), -cfg.bx, cfg.bx);
        if (S.mode !== 'playing') return;
      }
      if (tw.z > S.pz + 14){ tw.dead = true; zapMesh(tw.mesh); }
    }
    towers = towers.filter(tw => !tw.dead);

    /* bridges: duck under, climb over, or crash */
    for (const b of bridges){
      b.shootT -= dt;
      if (b.shootT <= 0 && b.z < S.pz - 15 && b.z > S.pz - 140){ fireEbolt(-4.5, b.cy - 1.2, b.z + 1.2, 33); fireEbolt(4.5, b.cy - 1.2, b.z + 1.2, 33); b.shootT = 2.4 + Math.random() * 0.6; }
      if (!b.done && S.pz < b.z + 1.4 && S.pz > b.z - 2.4){
        if (S.py + 0.65 > b.y0 && S.py - 0.65 < b.y1){
          b.done = true;
          boom(S.px, S.py, S.pz - 2, 0xfb923c, 1.2);
          damage(14);
          S.ty = THREE.MathUtils.clamp(S.py < b.cy ? b.y0 - 1.3 : b.y1 + 1.3, cfg.yMin, cfg.yMax);
          if (S.mode !== 'playing') return;
        }
      }
      if (S.pz < b.z - 2.4) b.done = true;
      if (b.z > S.pz + 16){ b.passed = true; zapMesh(b.mesh); }
    }
    bridges = bridges.filter(b => !b.passed);

    /* enemy bolts */
    for (const b of ebolts){
      b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
      b.mesh.position.set(b.x, b.y, b.z);
      b.mesh.lookAt(b.x + b.vx, b.y + b.vy, b.z + b.vz);
      b.mesh.scale.z = 0.92 + Math.random() * 0.16;
      if (Math.hypot(b.x - S.px, b.y - S.py, b.z - S.pz) < 1.4){
        b.z = 9999; damage(8); if (S.mode !== 'playing') return;
      }
      if (b.z > S.pz + 12 || b.z < S.pz - 220) b.z = 9999;
    }
    ebolts = ebolts.filter(b => { if (b.z > 9000){ zapMesh(b.mesh); return false; } return true; });

    /* rings */
    for (const r of rings){
      r.mesh.rotation.z += dt * 0.7;
      if (!r.taken && Math.abs(r.z - S.pz) < 1.3){
        r.taken = true;
        if (Math.hypot(S.px - r.x, S.py - r.y) < 2.8){
          S.shield = Math.min(100, S.shield + 25); S.score += 50;
          pop('REPAIR +25 · +50', '#4ade80', 22); sndRing(); refreshHud();
        } else pop('MISS', '#94a3b8', 18);
        scene.remove(r.mesh);
      }
      if (r.z > S.pz + 8){ r.taken = true; scene.remove(r.mesh); }
    }
    rings = rings.filter(r => !r.taken);

    /* rocks */
    for (const r of rocks){
      r.z += r.vz * dt;
      r.mesh.position.set(r.x, r.y, r.z);
      r.mesh.rotation.y += r.spin * dt;
      if (Math.abs(r.z - (S.pz - 1)) < r.r * 0.9 && Math.hypot(r.x - S.px, r.y - S.py) < r.r * 0.95){
        boom(r.x, r.y, r.z, 0xd6c8a8, 1.3);
        scene.remove(r.mesh); r.dead = true;
        damage(15); if (S.mode !== 'playing') return;
      }
      if (r.z > S.pz + 14) r.dead = true;
      if (r.dead) scene.remove(r.mesh);
    }
    rocks = rocks.filter(r => !r.dead);

    /* boss */
    if (S.boss){
      const B = S.boss;
      S.bossSwayX = Math.sin(t * 0.3) * 3;
      B.mesh.position.set(S.bossSwayX, 0.6 + Math.sin(t * 0.5) * 0.4, bz);
      B.mesh.rotation.y = Math.PI;
      const wp = 0.5 + 0.5 * Math.sin(t * 6);
      for (const d of B.domes){
        if (!d.alive) continue;
        d.mesh.material.emissiveIntensity = 0.9 + wp * 1.5;
        if (d.halo){ d.halo.material.opacity = 0.16 + wp * 0.30; d.halo.scale.setScalar(1 + wp * 0.15); }
        if (d.marker){ d.marker.position.y = 9.6 + Math.sin(t * 3.5) * 0.45; d.marker.rotation.y = t * 2.2; }
      }
      if (B.coreOpen && B.coreMarker){ B.coreMarker.position.y = 8.1 + Math.sin(t * 3.5) * 0.45; B.coreMarker.rotation.y = t * 2.2; }
      if (B.coreOpen){
        const pulse = 1 + Math.sin(t * 6) * 0.15;
        B.coreGlow.scale.setScalar(pulse);
        B.fanT -= dt;
        if (B.fanT <= 0){
          fireEbolt(S.bossSwayX, 4.8, bz + 6, 36, -2.4, 0);
          fireEbolt(S.bossSwayX, 4.8, bz + 6, 36, 0, 0);
          fireEbolt(S.bossSwayX, 4.8, bz + 6, 36, 2.4, 0);
          B.fanT = 1.6;
        }
        if (B.coreHp <= 0){
          for (let i = 0; i < 7; i++) boom(S.bossSwayX + (Math.random() - 0.5) * 22, 4 + Math.random() * 5, bz + (Math.random() - 0.5) * 18, i % 2 ? 0xfb923c : 0xfacc15, 2 + Math.random() * 1.6);
          sndBoom(true);
          S.score += 2000;
          pop('DESTROYER DOWN! +2000', '#4ade80', 30);
          scene.remove(B.mesh); S.boss = null;
          refreshHud();
          setTimeout(() => { if (S.mode === 'playing') startHyper('stage2'); }, 1500);
        }
      } else {
        const aliveDomes = B.domes.filter(d => d.alive);
        B.fireT -= dt;
        if (B.fireT <= 0){ if (aliveDomes.length) { const d = aliveDomes[0]; fireEbolt(S.bossSwayX - d.mesh.position.x, 6.8, bz - 16, 37); } B.fireT = aliveDomes.length ? 1.7 : 3.2; }
        B.fireT2 -= dt;
        if (B.fireT2 <= 0){ if (aliveDomes.length > 1) { const d = aliveDomes[1]; fireEbolt(S.bossSwayX - d.mesh.position.x, 6.8, bz - 16, 37); } B.fireT2 = 2.3; }
      }
    }

    /* stage 2: exhaust port */
    if (S.coreFight){
      const C = S.coreFight, cz = S.pz - 55;
      C.mesh.position.set(0, 5.2, cz);
      C.glow.scale.setScalar(1 + Math.sin(t * 5) * 0.22);
      C.glow.material.opacity = 0.28 + (0.5 + 0.5 * Math.sin(t * 5)) * 0.25;
      C.portT -= dt;
      $('distVal').textContent = '⏱ ' + Math.max(0, Math.ceil(C.portT)) + 's';
      if (C.portT <= 0){
        boom(S.px, S.py, S.pz - 4, 0x4ade80, 3);
        sndBoom(true);
        S.overText = 'デス・スターの射程に入った…';
        ship.visible = false;
        endGame(false);
        return;
      }
      C.fanT -= dt;
      if (C.fanT <= 0){
        fireEbolt(-5.5, 8.5, cz, 35, 0.8, 0);
        fireEbolt(5.5, 8.5, cz, 35, -0.8, 0);
        C.fanT = 1.25;
      }
      C.foeT -= dt;
      if (C.foeT <= 0){
        spawnFoe('head', -2.5, 5 + Math.random() * 3, S.pz - 120);
        spawnFoe('head', 2.5, 6 + Math.random() * 3, S.pz - 128);
        if (!foes.some(f => f.kind === 'chase')) spawnFoe('chase', (Math.random() * 2 - 1) * 3, 7, S.pz - 120);
        C.foeT = 8;
      }
      if (C.hp <= 0){
        for (let i = 0; i < 9; i++) boom((Math.random() - 0.5) * 12, 5 + (Math.random() - 0.5) * 7, cz + (Math.random() - 0.5) * 6, i % 2 ? 0xfb923c : 0xfacc15, 2 + Math.random() * 1.8);
        sndBoom(true);
        S.score += 3000;
        pop('PORT DESTROYED! +3000', '#4ade80', 32);
        scene.remove(C.mesh); S.coreFight = null;
        refreshHud();
        setTimeout(() => { if (S.mode === 'playing') startHyper('stage3'); }, 1400);
      }
    }
    if (S.walkerFight){
      const W = S.walkerFight;
      W.swayX = Math.sin(t * 0.25) * 2.5;
      W.wz += 2.0 * dt;
      W.mesh.position.set(W.swayX, Math.abs(Math.sin(t * 2.2)) * 0.35, W.wz);
      const legPhase = [0, Math.PI, Math.PI, 0];
      for (let li = 0; li < W.legs.length; li++) W.legs[li].rotation.x = Math.sin(t * 2.2 + legPhase[li]) * 0.38;
      W.marker.position.y = 11.4 + Math.sin(t * 3.2) * 0.35;
      W.fireT -= dt;
      if (W.fireT <= 0){
        fireEbolt(W.swayX - 1.2, 7.6, W.wz + 8, 36, -1.6, 0);
        fireEbolt(W.swayX + 1.2, 7.6, W.wz + 8, 36, 1.6, 0);
        fireEbolt(W.swayX, 8.4, W.wz + 8, 36, 0, 0);
        W.fireT = 1.7;
      }
      W.foeT -= dt;
      if (W.foeT <= 0){
        spawnFoe('head', -3, 6, S.pz - 130);
        spawnFoe('head', 3, 7, S.pz - 138);
        W.foeT = 7.5;
      }
      if (W.wz > S.pz - 15){
        damage(22);
        boom(S.px, S.py, S.pz - 6, 0xfb923c, 2.2);
        pop('STOMPED!', '#f87171', 26);
        W.wz = S.pz - 55;
        if (S.mode !== 'playing') return;
      }
      if (W.hp <= 0){
        for (let i = 0; i < 9; i++) boom(W.swayX + (Math.random() - 0.5) * 10, 3 + Math.random() * 9, W.wz + (Math.random() - 0.5) * 10, i % 2 ? 0xfb923c : 0xfacc15, 2 + Math.random() * 1.8);
        sndBoom(true);
        S.score += 4000;
        pop('WALKER DOWN! +4000', '#4ade80', 32);
        scene.remove(W.mesh); S.walkerFight = null;
        refreshHud();
        setTimeout(() => { if (S.mode === 'playing') startHyper('clear'); }, 1500);
      }
    }
    refreshHud();
  }
  else {
    ship.position.set(Math.sin(t * 0.4) * 1.5, 6.5 + Math.sin(t * 0.8) * 0.5, 0);
    ship.rotation.z = Math.sin(t * 0.4) * 0.12;
    reticle.visible = reticle2.visible = false;
    if (S.mode === 'title'){ _camV.set(7.5, 9.5, 13); camera.position.lerp(_camV, 1 - Math.exp(-3 * dt)); camera.lookAt(0, 6, -6); }
  }

  if (S.mode === 'playing'){
    _camV.set(S.px * 0.62, S.py * 0.62 + 2.7, S.pz + 9.5); camera.position.lerp(_camV, 1 - Math.exp(-8.5 * dt));
    camera.lookAt(S.px * 0.85, S.py * 0.85 + 0.3, S.pz - 30);
    reticle.visible = reticle2.visible = true;
    reticle.position.set(S.px, S.py, S.pz - 26);
    reticle2.position.set(S.px, S.py, S.pz - 13);
  }
  stars.position.z = S.pz - 120;
  planet.position.z = S.pz - 190;
  if (S.stage === 2 && S.mode === 'playing' && S.dist < 780 && !S.coreFight){
    dsGroup.visible = true;
    dsGroup.position.set(10, 58, S.pz - 430 + Math.min(S.dist * 0.35, 110));
  } else dsGroup.visible = false;
  if (trench.visible) trench.position.z = S.pz + 20 + (S.dist % 270);
  trenchLight.intensity = trench.visible ? 0.5 : 0;
  if (canyon.visible){
    for (const seg of canyonSegs){
      while (seg.position.z > S.pz + 25) seg.position.z -= 540;
      const cDist = 15 - seg.position.z;
      seg.visible = !(cDist > 1280 && cDist < 2020);
    }
    groundMesh.position.z = S.pz - 170; groundTex.offset.y = (S.dist / 6.667) % 1; sunMesh.position.set(S.px * 0.15 + 40, 64, S.pz - 330);
  }
  canyonLight.intensity = canyon.visible ? 0.42 : 0;

  for (let i = booms.length - 1; i >= 0; i--){
    const b = booms[i]; b.t += dt;
    const k = b.t / 0.34;
    b.m.scale.setScalar(b.scale * (0.5 + k * 1.8));
    b.m.material.opacity = Math.max(0, 0.9 * (1 - k));
    if (k >= 1){ scene.remove(b.m); b.m.material.dispose(); booms.splice(i, 1); }
  }
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
